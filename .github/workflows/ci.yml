name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run repository hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run full test suite with JUnit output
        run: |
          mkdir -p target/test-results
          cargo test -- --nocapture > target/test-results/cargo-test.log 2>&1 || true
          python3 scripts/generate_junit_from_cargo.py target/test-results/cargo-test.log target/test-results/junit.xml

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: target/test-results/junit.xml
          if-no-files-found: error

      - name: Publish test results to PR checks
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Rust test results
          path: target/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Smoke test minimal example
        run: scripts/oberon0 examples/hello-app --run

      - name: Smoke test import manifest example
        run: scripts/oberon0 examples/imports-manifest --run
