[package]
name = "oberon0c"
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/steven-r/Oberon0-Rust"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
logos = "0.16"
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly,coverage)'] }

[dev-dependencies]
cargo-llvm-cov = "0.8"
datatest-stable = "0.3.3"
rstest = "0.26.1"

[[test]]
name = "codegen_golden"
harness = false

[[bin]]
name = "oberon0"
path = "src/main.rs"
